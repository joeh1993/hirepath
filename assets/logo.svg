<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72">
  <!-- Icon: blue rounded square -->
  <rect x="0" y="6" width="60" height="60" rx="13" fill="#1A56DB"/>

  <!-- Upward path: three nodes connected by a line, representing the recruitment journey -->
  <!-- Connecting line -->
  <line x1="14" y1="53" x2="46" y2="18" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  <!-- Node 1: sourced candidate (bottom left, solid white) -->
  <circle cx="14" cy="53" r="5.5" fill="white" opacity="0.85"/>
  <!-- Node 2: shortlisted (middle, solid white) -->
  <circle cx="30" cy="35.5" r="5" fill="white"/>
  <!-- Node 3: placed (top right, bullseye — destination) -->
  <circle cx="46" cy="18" r="7" fill="#93C5FD"/>
  <circle cx="46" cy="18" r="3.5" fill="white"/>

  <!-- Wordmark: "Hire" dark navy, "Path" brand blue -->
  <text x="76" y="45"
        font-family="'Segoe UI', 'Inter', Arial, sans-serif"
        font-size="31" font-weight="800" fill="#1E3A5F">Hire</text>
  <text x="148" y="45"
        font-family="'Segoe UI', 'Inter', Arial, sans-serif"
        font-size="31" font-weight="800" fill="#1A56DB">Path</text>

  <!-- Tagline -->
  <text x="77" y="61"
        font-family="'Segoe UI', 'Inter', Arial, sans-serif"
        font-size="9.5" fill="#9CA3AF" letter-spacing="2">AI RECRUITMENT ASSISTANT</text>
</svg>
